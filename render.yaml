services:
  - type: web
    name: threatscope-backend
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.engine:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: THREATSCOPE_CORS_ORIGINS
        value: "*"
